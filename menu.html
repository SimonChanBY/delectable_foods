<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Delectable Foods</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:25px;
}

.category{
    padding:20px;
}

.category-title{
    background:#3498db;
    color:white;
    padding:12px;
    border-radius:8px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.info{
    padding:15px;
}

.name{
    font-size:18px;
    font-weight:bold;
}

.price{
    font-size:22px;
    color:green;
    font-weight:bold;
    margin-top:8px;
}

.toast-note{
    background:#fff3cd;
    margin-top:15px;
    padding:12px;
    border-left:5px solid orange;
}

</style>
</head>
<body>

<header>
<h1>🍽 Delectable Foods</h1>
<h3>Digital Menu</h3>
</header>

<div id="menuContainer"></div>

<script>

const menu = {
  "Starters":[
    {name:"Chicken Wings",price:2, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRiCH9I7TQo5GxyWykQuHoBev8D1pMky-xXpfmsf1hobA&s=10"},
    {name:"Chicken Nuggets",price:2, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEOXo54uSJboePLu66LIeVJF7pzfxfJPEdZbDLhN2nZA&s=10"},
    {name:"Truffle Fries",price:4, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf_Owc0s0zDBCdAn97E5nd01RokEzTVTEBVhypRwz15A&s=10"},
    {name:"Calamari Rings",price:8, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTZuKLMR7aL-7N5HsOezUOdS-RdhBllPC_miyAzdYhuGA&s=10"}
  ],
  "Toast":[
    {name:"Kaya Toast",price:2.60, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyPQSr_0Q3X8kXpYEce2h4_q4sB1_c9UvcP6aEF2OEyg&s=10"},
    {name:"Kaya Butter Toast",price:2.80, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTwSe2zD_0zmPoWQ48CD5T-KOlpn-HyzDgEAtEk0zFnEg&s=10"},
    {name:"Peanut Toast",price:2.60, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTTNylVcJvb5-fId3CQW2rxzu1BUjv6U58cOSwCUJntRw&s=10"},
    {name:"Peanut Butter Toast",price:2.80, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTpVedDoHDmu_8ckNlrYh2vV1zOM2mRsJJGlwxRrxHyMw&s=10"}
  ],
  "Local Delights":[
    {name:"Chicken Rice",price:8, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTn30EAtWEM9JIY4SekMqwSeE8M_1NuYtuDyHGv4KHowQ&s=10"},
    {name:"Laksa",price:5, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3DtUkJObKk0rmdqLtd7QgwW0ObaDTsjHZi11XQF22pw&s=10"},
    {name:"Mee Rebus",price:5, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS8SUAzApM8_ypzYyhzEglKnSkbxvWxmVAYfKy_BXdU6w&s=10"},
    {name:"Mee Siam",price:5, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgv2wjOtyzl87j7jnzTqQko4PUQ2OKttwj0s0IRroCBA&s=10"}
  ],
  "Dessert":[
    {name:"Kaya Balls",price:3, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScC5bdqQfP0IbP9AH6wSy8zEW8gryDwi551CeqVzxBzQ&s=10"},
    {name:"Butter Cake",price:2.50, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSMuBpIncTfs38eEhPNc9kZ5arXrptBxxcbSmMQQRCrSA&s=10"},
    {name:"Banana Cake",price:2.50, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSp1vMAl6B9CAkMnY1mglm8JQpsC6tkBH5xayZ0H6_4fQ&s=10"},
    {name:"Chocolate Cake",price:2.50, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTbSTB_I-dhyT_QxiFK16h5iU-7DHQqitqDV2SYYeDmGA&s=10"}
  ],
  "Drinks":[
    {name:"Kopi / Tea",price:1.20, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFcCl1ZjxN48-UKuElqjixW5lG2OliQdQUkjw0-bq7EA&s=10"},
    {name:"Kopi / Tea O",price:1.10, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFcCl1ZjxN48-UKuElqjixW5lG2OliQdQUkjw0-bq7EA&s=10"},
    {name:"Kopi / Tea C",price:1.30, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFcCl1ZjxN48-UKuElqjixW5lG2OliQdQUkjw0-bq7EA&s=10"},
    {name:"Milo",price:1.60, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFcCl1ZjxN48-UKuElqjixW5lG2OliQdQUkjw0-bq7EA&s=10"}
  ]
};

let html="";

for(const category in menu){

html+=`
<div class="category">
<h2 class="category-title">${category}</h2>
<div class="grid">
`;

menu[category].forEach(item=>{

html+=`
<div class="card">

<!-- <img src="https://placehold.co/600x400?text=${encodeURIComponent(item.name)}"> -->
<img src="${item.img}">

<div class="info">
<div class="name">${item.name}</div>
<div class="price">$${item.price.toFixed(2)}</div>
</div>

</div>
`;

});

html+=`</div>`;

if(category==="Toast"){
html+=`
<div class="toast-note">
⭐ Add $1.50 to make any toast into a set meal
</div>`;
}

html+=`</div>`;

}

document.getElementById("menuContainer").innerHTML=html;

</script>

</body>
</html>
